<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 Companies — PlacementPro</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { font-family:'DM Sans',sans-serif; }

.c26-hero {
  text-align:center; padding:3.5rem 1rem 2rem; position:relative; overflow:hidden;
}
.c26-hero::before {
  content:''; position:absolute; top:-100px; left:50%; transform:translateX(-50%);
  width:600px; height:400px;
  background:radial-gradient(ellipse,rgba(251,191,36,0.12) 0%,transparent 65%);
  pointer-events:none;
}
.c26-eyebrow {
  display:inline-flex; align-items:center; gap:7px;
  font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.1em;
  color:#fbbf24; background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.28);
  padding:5px 14px; border-radius:99px; margin-bottom:1.1rem;
}
.c26-hero h1 {
  font-family:'Syne',sans-serif; font-size:clamp(1.8rem,4.5vw,2.6rem); font-weight:800;
  color:#fff; margin-bottom:0.5rem; letter-spacing:-0.01em;
}
.c26-hero h1 em {
  font-style:normal; background:linear-gradient(90deg,#fbbf24,#f59e0b);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.c26-hero p { font-size:0.9rem; color:rgba(255,255,255,0.42); max-width:480px; margin:0 auto; }

.c26-stats {
  display:flex; gap:0; justify-content:center; flex-wrap:wrap;
  background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07);
  border-radius:16px; overflow:hidden; max-width:600px; margin:1.75rem auto 0;
}
.c26-stat { flex:1; min-width:130px; padding:1rem; text-align:center; border-right:1px solid rgba(255,255,255,0.07); }
.c26-stat:last-child { border-right:none; }
.c26-stat-val { font-family:'Syne',sans-serif; font-size:1.4rem; font-weight:800; color:#fbbf24; display:block; }
.c26-stat-lbl { font-size:0.65rem; color:rgba(255,255,255,0.35); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }

.c26-controls {
  max-width:900px; margin:2rem auto 1.5rem; display:flex; gap:0.75rem; flex-wrap:wrap;
  padding:0 1rem;
}
.c26-search {
  flex:1; min-width:220px; background:#12121f; border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; padding:0.75rem 1.1rem; color:#fff; font-size:0.88rem;
  font-family:'DM Sans',sans-serif;
}
.c26-search::placeholder { color:rgba(255,255,255,0.3); }
.c26-search:focus { outline:none; border-color:rgba(251,191,36,0.4); }
.c26-sort {
  background:#12121f; border:1px solid rgba(255,255,255,0.1); border-radius:12px;
  padding:0.75rem 1rem; color:#fff; font-size:0.85rem; font-family:'DM Sans',sans-serif; cursor:pointer;
}

.c26-grid {
  max-width:1100px; margin:0 auto; padding:0 1rem 3rem;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem;
}

.c26-card {
  background:#0e0e1e; border:1px solid rgba(255,255,255,0.08); border-radius:16px;
  padding:1.25rem; transition:border-color 0.2s, transform 0.15s; position:relative; overflow:hidden;
}
.c26-card:hover { border-color:rgba(251,191,36,0.35); transform:translateY(-2px); }
.c26-card-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:0.75rem; gap:0.5rem; }
.c26-card-name { font-family:'Syne',sans-serif; font-size:1.05rem; font-weight:800; color:#fff; line-height:1.25; }
.c26-card-date { font-size:0.68rem; color:rgba(255,255,255,0.32); white-space:nowrap; margin-top:2px; }
.c26-card-role { font-size:0.78rem; color:rgba(255,255,255,0.5); margin-bottom:0.9rem; line-height:1.4; }

.c26-badges { display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:0.6rem; }
.c26-badge {
  display:inline-flex; align-items:center; gap:4px;
  font-size:0.72rem; font-weight:700; padding:4px 9px; border-radius:8px;
}
.b-ctc  { background:rgba(52,211,153,0.1); color:#34d399; }
.b-cgpa { background:rgba(124,106,247,0.1); color:#a89df7; }
.b-stipend { background:rgba(251,191,36,0.1); color:#fbbf24; }

.c26-meta { font-size:0.72rem; color:rgba(255,255,255,0.3); display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap; }
.c26-meta span:not(:last-child)::after { content:'·'; margin-left:0.4rem; color:rgba(255,255,255,0.15); }

.c26-empty { text-align:center; padding:3rem 1rem; color:rgba(255,255,255,0.3); font-size:0.9rem; }

.c26-loadmore {
  display:block; margin:0 auto 3rem; background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.3);
  color:#fbbf24; padding:0.75rem 2rem; border-radius:12px; font-size:0.85rem; font-weight:700;
  font-family:'Syne',sans-serif; cursor:pointer;
}
.c26-loadmore:hover { background:rgba(251,191,36,0.18); }
</style>
</head>
<body>
<div id="toast"></div>

<nav class="navbar">
  <div class="nav-logo">
    <a href="dashboard.html" style="display:flex;align-items:center;gap:8px;color:inherit">
      <span class="dot"></span> PlacementPro
    </a>
  </div>
  <ul class="nav-links">
    <li><a href="dashboard.html">Dashboard</a></li>
  </ul>
</nav>

<div class="c26-hero">
  <div class="c26-eyebrow"><span style="width:6px;height:6px;border-radius:50%;background:#fbbf24"></span> Live Placement Data</div>
  <h1>2026 <em>Campus Placements</em></h1>
  <p>Real companies, real CTCs, real CGPA cutoffs — from this year's on-campus drives</p>

  <div class="c26-stats">
    <div class="c26-stat"><span class="c26-stat-val" id="stat-total">—</span><span class="c26-stat-lbl">Companies</span></div>
    <div class="c26-stat"><span class="c26-stat-val" id="stat-avgctc">—</span><span class="c26-stat-lbl">Avg CTC</span></div>
    <div class="c26-stat"><span class="c26-stat-val" id="stat-maxctc">—</span><span class="c26-stat-lbl">Highest CTC</span></div>
  </div>
</div>

<div class="c26-controls">
  <input type="text" class="c26-search" id="c26-search" placeholder="🔍 Search company, role, or location...">
  <select class="c26-sort" id="c26-sort" onchange="renderGrid()">
    <option value="date">Sort: Latest First</option>
    <option value="ctc">Sort: Highest CTC</option>
    <option value="cgpa">Sort: Lowest CGPA Criteria</option>
    <option value="name">Sort: A-Z</option>
  </select>
</div>

<div class="c26-grid" id="c26-grid"></div>
<button class="c26-loadmore" id="loadmore-btn" onclick="loadMore()" style="display:none">Load More Companies</button>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
Auth.requireAuth();

let allCompanies = [];
let filtered = [];
let shown = 0;
const BATCH = 30;

function parseCTC(ctcStr) {
  const m = (ctcStr || '').match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 0;
}

async function init() {
  try {
    allCompanies = await API.call('/companies2026');
  } catch (e) {
    document.getElementById('c26-grid').innerHTML = '<div class="c26-empty">Data load nahi ho payi. Refresh karke try karo.</div>';
    return;
  }

  document.getElementById('stat-total').textContent = allCompanies.length;
  const ctcVals = allCompanies.map(c => parseCTC(c.ctc)).filter(v => v > 0);
  const avg = ctcVals.length ? (ctcVals.reduce((a,b)=>a+b,0) / ctcVals.length).toFixed(1) : 0;
  const max = ctcVals.length ? Math.max(...ctcVals).toFixed(1) : 0;
  document.getElementById('stat-avgctc').textContent = '₹' + avg + 'L';
  document.getElementById('stat-maxctc').textContent = '₹' + max + 'L';

  filtered = allCompanies;
  renderGrid();
}

function renderGrid() {
  const sortBy = document.getElementById('c26-sort').value;
  const sorted = [...filtered];

  if (sortBy === 'ctc') sorted.sort((a,b) => parseCTC(b.ctc) - parseCTC(a.ctc));
  else if (sortBy === 'cgpa') sorted.sort((a,b) => (a.cgpa||0) - (b.cgpa||0));
  else if (sortBy === 'name') sorted.sort((a,b) => a.name.localeCompare(b.name));
  else sorted.sort((a,b) => new Date(b.date) - new Date(a.date));

  filtered = sorted;
  shown = 0;
  document.getElementById('c26-grid').innerHTML = '';
  renderBatch();
}

function renderBatch() {
  const grid = document.getElementById('c26-grid');
  const batch = filtered.slice(shown, shown + BATCH);

  if (shown === 0 && batch.length === 0) {
    grid.innerHTML = '<div class="c26-empty">Koi company nahi mili is search ke liye 🔍</div>';
    document.getElementById('loadmore-btn').style.display = 'none';
    return;
  }

  batch.forEach(c => {
    const div = document.createElement('div');
    div.className = 'c26-card';
    div.innerHTML = `
      <div class="c26-card-top">
        <div class="c26-card-name">${c.name}</div>
        <div class="c26-card-date">${c.date ? new Date(c.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'2-digit'}) : ''}</div>
      </div>
      <div class="c26-card-role">${c.role || '—'}</div>
      <div class="c26-badges">
        ${c.ctc ? `<span class="c26-badge b-ctc">💰 ${c.ctc}</span>` : ''}
        ${c.cgpa ? `<span class="c26-badge b-cgpa">🎓 ${c.cgpa}+ CGPA</span>` : `<span class="c26-badge b-cgpa">🎓 No cutoff</span>`}
        ${c.stipend && c.stipend !== '-' ? `<span class="c26-badge b-stipend">💵 ${c.stipend}</span>` : ''}
      </div>
      <div class="c26-meta">
        ${c.duration && c.duration !== '-' ? `<span>⏱️ ${c.duration}</span>` : ''}
        ${c.location && c.location !== '-' ? `<span>📍 ${c.location}</span>` : ''}
      </div>
    `;
    grid.appendChild(div);
  });

  shown += batch.length;
  document.getElementById('loadmore-btn').style.display = shown < filtered.length ? 'block' : 'none';
}

function loadMore() { renderBatch(); }

let searchTimeout;
document.getElementById('c26-search').addEventListener('input', function(e) {
  clearTimeout(searchTimeout);
  const q = e.target.value.toLowerCase().trim();
  searchTimeout = setTimeout(() => {
    filtered = allCompanies.filter(c =>
      (c.name||'').toLowerCase().includes(q) ||
      (c.role||'').toLowerCase().includes(q) ||
      (c.location||'').toLowerCase().includes(q)
    );
    renderGrid();
  }, 200);
});

init();
</script>
</body>
</html>
